# iOS 工程（xcodegen），App 名、包名、分类取自游戏档案（dm/games/<名>/game.tsv，build_ipa.sh 经环境变量给）。tools/build_ipa.sh 先生成 Gen/（宿主源文件链接、内嵌的改写后模块、iOS 着色器库、宿主表），再出包。
# iOS project (xcodegen); the app name, bundle ID and category come from the game profile (dm/games/<id>/game.tsv, passed by build_ipa.sh through environment variables). tools/build_ipa.sh generates Gen/ first (host source links, the embedded rewritten modules, iOS shader libraries, host tables), then packages.
name: DmIOS
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "18.0"   # ACNH uses the Metal 3 replay path on iOS 18 and later.
configFiles:     # build_ipa.sh 生成：内嵌段链接参数 + 从 dm/host/Makefile 取的头文件路径与框架 | Generated by build_ipa.sh: embedded-segment link flags + header paths and frameworks taken from dm/host/Makefile
  Release: Gen/dm.xcconfig
  Debug: Gen/dm.xcconfig
targets:
  DmIOS:
    type: application
    platform: iOS
    dependencies:
      - sdk: Photos.framework
      - sdk: CoreNFC.framework
      - sdk: Security.framework
    sources:
      - Sources
      - path: Gen/embed.S
      - path: Gen/dm          # 改写器的表（*.fixups.tsv / gates / params / cuts / obs）+ 着色器映射表 / c1 清单 / 预热清单 | Rewriter tables (*.fixups.tsv / gates / params / cuts / obs) + shader map / c1 list / warm-up list
        type: folder
        buildPhase: resources
      - path: Gen/msl         # iOS 版 metallib + 反射 json（DM_MSL_DIR） | iOS metallib + reflection json (DM_MSL_DIR)
        type: folder
        buildPhase: resources
      - path: Gen/Assets.xcassets   # App 图标（build_ipa.sh 由游戏图标生成；没有图标时是空目录，xcodegen 不论它在不在都会列进工程） | app icon (generated by build_ipa.sh from the game icon; an empty catalog when there is none, since xcodegen lists it in the project whether or not it exists)
      - path: Gen/src         # dm/host/Makefile 编译命令里的源文件（tools/gen_build.py 链入） | Source files from the compile commands of dm/host/Makefile (linked in by tools/gen_build.py)
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"
    info:
      path: Sources/Info.plist
      properties:
        NSPhotoLibraryAddUsageDescription: "将游戏相机拍摄的照片保存到手机相册。"
        NFCReaderUsageDescription: "只读检测你贴近手机的 NFC 卡片，用于验证 amiibo 读卡通道。"
        CFBundleDisplayName: ${DM_DISPLAY_NAME}   # 游戏档案 app_name（build_ipa.sh 设） | game profile app_name (set by build_ipa.sh)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchStoryboardName: ""
        UIFileSharingEnabled: true          # 「文件」App 里能看到 Documents（log.txt、存档） | Documents (log.txt, saves) visible in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationCategoryType: ${DM_APP_CATEGORY}   # 游戏档案 app_category | game profile app_category
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true   # 实体手柄（GameController） | Physical controllers (GameController)
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    entitlements:
      path: Sources/ACNH.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      PRODUCT_NAME: DmIOS
      DEVELOPMENT_TEAM: ${DM_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: $(DM_APPICON)   # 有游戏图标时 Gen/dm.xcconfig 设 DM_APPICON = AppIcon；空 = 不设图标（xcodegen 缺省填 AppIcon，资源目录里没有就出包失败） | Gen/dm.xcconfig sets DM_APPICON = AppIcon when there is a game icon; empty = no icon (xcodegen's default is AppIcon, which fails the build when the catalog lacks it)
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -march=armv8.2-a+lse -DDM_NVN_M3=1 -Werror=unguarded-availability-new   # Preserve LSE without requiring A18 instructions; reject unguarded newer APIs.
      CLANG_ENABLE_OBJC_ARC: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_WARN_INHIBIT_ALL_WARNINGS: NO
