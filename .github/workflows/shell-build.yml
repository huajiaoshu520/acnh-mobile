name: Build game-free iOS shell
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release after the build and audits pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: official-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shell:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rewriter test dependency
        run: python -m pip install capstone==5.0.7
      - name: Require Duo-capable SDK
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import subprocess
          sdk=subprocess.check_output(["xcrun","--sdk","iphoneos","--show-sdk-version"],text=True).strip()
          assert tuple(map(int,sdk.split(".")[:2])) >= (27,1), "Duo testing release requires iOS 27.1 SDK"
          PY
      - name: Validate version and publication target
        env:
          SHOULD_PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          python3 - <<'PY'
          import json,os,re
          v=json.load(open('config/version.json'))
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){2}',v['version'])
          tag='v'+v['version']
          if os.environ['GITHUB_REF_TYPE']=='tag':assert os.environ['GITHUB_REF_NAME']==tag
          elif os.environ['SHOULD_PUBLISH']=='true':assert os.environ['GITHUB_REF_NAME']=='main','Publish from main only'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_TAG='+tag+'\nAPP_VERSION='+v['version']+'\nAPP_BUILD='+str(v['build'])+'\n')
          PY
      - name: Audit source and test packaging
        run: |
          python tools/audit_release.py .
          python tools/test_shell.py
          python tools/test_one_click.py
          python tools/test_prepare_game.py
          python tools/test_nro_embed.py
          python tools/test_album_save.py
          clang -fobjc-arc dm/host/tests/t_caps_pixels.m dm/host/caps_photo.m -framework Foundation -framework CoreGraphics -framework ImageIO -framework UniformTypeIdentifiers -o "$RUNNER_TEMP/t-caps-pixels"
          "$RUNNER_TEMP/t-caps-pixels"
          clang -Wall -Wextra -Werror dm/ios/tests/t_adaptive_layout.c -framework CoreGraphics -o "$RUNNER_TEMP/t-adaptive-layout"
          "$RUNNER_TEMP/t-adaptive-layout"
          clang -fobjc-arc dm/ios/tests/t_save_file_coordinator.m dm/ios/Sources/SaveFileCoordinator.m -framework Foundation -o "$RUNNER_TEMP/t-save-coordinator"
          "$RUNNER_TEMP/t-save-coordinator"
          python tools/test_launcher.py
          python tools/test_own_compilers.py
          python dm/gfx/tools/test_dmsh_alpha.py
          python dm/gfx/tools/test_upstream_shader.py
          python tools/test_nsp_chain.py
          python tools/test_nsp_mac.py
          python dm/tools/tests/test_nsp_mac_app.py
          python dm/tools/tests/test_launcher_settings.py
          python dm/tools/tests/test_address_regions.py
          python dm/tools/tests/test_patches.py
          python tools/test_shader_tables.py
          clang -Wall -Wextra -Werror dm/ios/tests/t_touch_feedback.c -o "$RUNNER_TEMP/t-touch-feedback"
          "$RUNNER_TEMP/t-touch-feedback"
          clang -Wall -Wextra -Werror dm/ios/tests/t_acnh_wheel.c -o "$RUNNER_TEMP/t-acnh-wheel"
          "$RUNNER_TEMP/t-acnh-wheel"
          clang -fobjc-arc dm/ios/tests/t_photo_host.m -framework Foundation -o "$RUNNER_TEMP/t-photo-host"
          "$RUNNER_TEMP/t-photo-host"
          clang -fobjc-arc dm/ios/tests/t_pad_layout.m -framework Foundation -framework CoreGraphics -o "$RUNNER_TEMP/t-pad-layout"
          "$RUNNER_TEMP/t-pad-layout"
          clang -fobjc-arc dm/ios/tests/t_log_files.m -framework Foundation -o "$RUNNER_TEMP/t-log-files"
          "$RUNNER_TEMP/t-log-files"
          make -C dm/host/tests GAME=01006F8002326000 build/t_hid build/t_audren_open build/t_audren_work build/t_haptics build/t_haptics_apple build/t_gesture build/t_nro
          dm/host/tests/build/t_haptics
          dm/host/tests/build/t_haptics_apple
          dm/host/tests/build/t_gesture
          dm/host/tests/build/t_nro
          dm/host/tests/build/t_hid
          make -C dm/host/tests GAME=01006F8002326000 build/t_motion build/t_motion_apple build/t_motion_pro build/t_motion_pro_mac
          dm/host/tests/build/t_motion
          dm/host/tests/build/t_motion_apple
          dm/host/tests/build/t_motion_pro
          dm/host/tests/build/t_motion_pro_mac
          dm/host/tests/build/t_audren_open
          dm/host/tests/build/t_audren_work
          make -C dm/host/tests GAME=01006F8002326000 build/t_audren_layout
          dm/host/tests/build/t_audren_layout
          make -C dm/host/tests GAME=01006F8002326000 build/t_fs_commit_list build/t_audio_device
          dm/host/tests/build/t_fs_commit_list
          dm/host/tests/build/t_audio_device
      - name: Install project generator
        run: brew install xcodegen
      - name: Build official Metal 4 shell without game files
        run: python tools/build_shell.py --work "$RUNNER_TEMP/shell-work" --output "$RUNNER_TEMP/shell-output"
      - name: Verify exact IPA contents, metadata and Metal 4 build
        run: |
          python tools/verify_shell.py "$RUNNER_TEMP/shell-output"
          python - <<'PY'
          import os,pathlib,zipfile
          p=next((pathlib.Path(os.environ["RUNNER_TEMP"])/"shell-output").glob("*.ipa"))
          with zipfile.ZipFile(p) as z:
              binary=z.read(next(n for n in z.namelist() if n.endswith(".app/DmIOS")))
              assert b"UIHingeInteraction" in binary and b"reservedRegionsOfKind:" in binary, "Duo code was compiled out"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ACNHMobile-iOS26-v${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}-shell
          path: ${{ runner.temp }}/shell-output/*
          if-no-files-found: error
      - name: Publish verified shell from main
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/shell-output/* \
            --target "$(git rev-parse HEAD)" --draft \
            --title "ACNH Mobile $RELEASE_TAG · 官方 Metal 4 空壳" \
            --notes-file "docs/RELEASE-$RELEASE_TAG.zh-CN.md"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/remote-shell"
          python tools/verify_shell.py "$RUNNER_TEMP/remote-shell"
          gh release edit "$RELEASE_TAG" --draft=false --latest
