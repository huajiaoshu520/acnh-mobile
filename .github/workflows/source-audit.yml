name: Source release audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_release.py .
      - run: python tools/public_setup.py --help
      - run: python tools/test_shell.py
      - run: python tools/test_one_click.py
      - run: python tools/test_prepare_game.py
      - run: python tools/test_launcher.py
      - run: python tools/test_own_compilers.py
      - run: python dm/gfx/tools/test_dmsh_alpha.py
      - run: python dm/gfx/tools/test_upstream_shader.py
      - run: python tools/test_nsp_chain.py
      - run: python tools/test_shader_tables.py
      - run: python tools/test_nsp_mac.py
      - run: python tools/test_reference.py
      - run: python dm/tools/tests/test_patches.py
